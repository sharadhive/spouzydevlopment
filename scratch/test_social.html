<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social Icons Test</title>
<style>
  body {
    background: #1e0e13;
    padding: 50px;
    font-family: sans-serif;
    color: #fff;
  }
  .test-row {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 30px;
  }
  .sp-footer-social {
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .sp-social-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    color: #ffffff;
    text-decoration: none;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    flex-shrink: 0;
  }
  .sp-social-btn:hover {
    transform: translateY(-2px) scale(1.06);
    filter: brightness(1.1);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45);
  }
  .sp-social-btn:focus-visible {
    outline: 2px solid #e08b73;
    outline-offset: 3px;
  }
  .sp-social-fb {
    background: #1877F2;
  }
  .sp-social-x {
    background: #000000;
    border: 1px solid rgba(255, 255, 255, 0.22);
  }
  .sp-social-li {
    background: #0A66C2;
  }
  .sp-social-ig {
    background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
  }
  .sp-social-placeholder {
    cursor: default;
  }
  .sp-social-placeholder:hover {
    transform: none;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
    filter: none;
  }
</style>
</head>
<body>
  <h3>Preview Social Icons</h3>
  <div class="test-row">
    <!-- Option A: Standard Paths -->
    <div class="sp-footer-social">
      <!-- Facebook -->
      <a href="#" class="sp-social-btn sp-social-fb" aria-label="Share SPOUZY on Facebook">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">

        </svg>
      </a>

      <!-- X -->

        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>

    </div>
  </div>
</body>
</html>
